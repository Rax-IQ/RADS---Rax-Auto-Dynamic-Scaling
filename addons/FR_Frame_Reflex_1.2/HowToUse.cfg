=============================================================================
 FrameReflex – Adaptive Real-Time Performance Scaling
 Version  : 1.2
 Engine   : Godot 4.3+  |  Renderer: Forward+ or Mobile (required for FSR)
=============================================================================

 WHAT IS FRAMEREFLEX?
 --------------------
 FrameReflex is a DLSS-like intelligent performance system that dynamically
 adjusts rendering quality in real time based on FPS to maintain smooth gameplay
 without manual tweaking.

 It controls five major rendering systems at the same time:

   1. 3D Resolution Scale   (internal render resolution before upscaling)
   2. FSR Mode              ( FSR 1 fast / OFF native)
   3. Anti-Aliasing         (TAA + MSAA / FXAA / OFF depending on mode)
   4. Shadow Atlas Size     (shadow quality based on FPS tier)
   5. LOD Bias              (Level of Detail distance scaling)

=============================================================================
