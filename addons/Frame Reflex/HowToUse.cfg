 WHAT IS FRAME-REFLEX?
ـــــــــــــــــــــــــــــــــــــــــــــ
Frame Reflex is a single-script autoload plugin for Godot 4.3+ 
that continuously measures your game's real runtime performance and adjusts the rendering pipeline on the fly —
render scale, shadow quality, FSR,LOD budget, SSAO, SSIL, SDFGI, and more.
No manual per-device config. No build variants. Drop it in and forget about it.

 It controls five major rendering systems at the same time:

   1. 3D Resolution Scale   (internal render resolution before upscaling)
   2. FSR Mode              ( FSR 1 fast / OFF native)
   3. Anti-Aliasing         (TAA + MSAA / FXAA / OFF depending on mode)
   4. Shadow Atlas Size     (shadow quality based on FPS tier)
   5. LOD Bias              (Level of Detail distance scaling)

